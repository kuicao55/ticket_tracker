<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ticket-tracker{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg?v={{ version }}" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/uplot.min.css?v={{ version }}">
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
  <script src="/static/js/htmx.min.js?v={{ version }}" defer></script>
  <script src="/static/js/alpine.min.js?v={{ version }}" defer></script>
  <script src="/static/js/uplot.iife.min.js?v={{ version }}" defer></script>
  <script src="/static/js/app.js?v={{ version }}" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark"></span><span>ticket-tracker</span></a>
      <nav class="nav" aria-label="Main">
        <a href="/" class="{% if page == "dashboard" %}active{% endif %}">Overview</a>
        <a href="/watches" class="{% if page == "watches" %}active{% endif %}">Watches</a>
        <a href="/users" class="{% if page == "users" %}active{% endif %}">Users</a>
        <a href="/settings" class="{% if page == "settings" %}active{% endif %}">Settings</a>
      </nav>
      <div class="topbar-meta">
        <span class="mono">v{{ version }}</span>
        <span class="mono muted">{{ now }}</span>
      </div>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
