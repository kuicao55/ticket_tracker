name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: rs
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Rename artifact
        id: rename
        shell: bash
        run: |
          BIN="rs/target/${{ matrix.target }}/release/tt"
          OUT="tt-${{ matrix.target }}"
          case "${{ matrix.os }}" in
            windows-*) BIN="$BIN.exe"; OUT="$OUT.exe" ;;
          esac
          cp "$BIN" "$OUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.name }}
          path: ${{ steps.rename.outputs.name }}
      - name: Upload to release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.name }}
          generate_release_notes: true
